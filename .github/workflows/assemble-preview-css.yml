name: assemble-preview-css
on:
  push:
    paths:
      - "src/app/_assemble/preview.part0.css"
      - "src/app/_assemble/preview.part1.css"
      - "src/app/_assemble/preview.part2.css"
      - ".github/workflows/assemble-preview-css.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Concatenate Ineffable preview.css
        run: |
          set -euo pipefail
          cat src/app/_assemble/preview.part0.css \
              src/app/_assemble/preview.part1.css \
              src/app/_assemble/preview.part2.css \
            > src/app/preview.css
          wc -c src/app/preview.css
          sha1sum src/app/preview.css
          test "$(wc -c < src/app/preview.css)" -eq 26541
          test "$(sha1sum < src/app/preview.css | awk '{print $1}')" = "54b674cbfcde091324bdcdb0e47bb57fc4b88fed"
          grep -q -- "--ink-bone: #E3DEC3" src/app/preview.css
          grep -q ".secret-proof-img" src/app/preview.css
      - name: Commit assembled file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/preview.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(preview): assemble full Ineffable CSS (26541 bytes)"
          git push
